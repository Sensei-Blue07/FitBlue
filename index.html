<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitBlue</title>
<meta name="theme-color" content="#121A26">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="bar"><h1>FitBlue</h1><button id="install" hidden>Installer</button></header>
<main>
<section id="accueil" class="tab on">
 <div class="hero">
  <svg viewBox="0 0 360 170" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A85FF"/><stop offset="1" stop-color="#1F3FA8"/></linearGradient></defs>
  <rect width="360" height="170" fill="url(#g)"/><path d="M0 120h90l15-40 25 70 22-100 20 70h188" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
  <g transform="rotate(-25 270 85)" fill="#fff"><rect x="205" y="80" width="130" height="10" rx="4"/><rect x="222" y="52" width="14" height="66" rx="5"/><rect x="304" y="52" width="14" height="66" rx="5"/><rect x="204" y="64" width="12" height="42" rx="5" fill="#FF6B57"/><rect x="324" y="64" width="12" height="42" rx="5" fill="#FF6B57"/></g></svg>
  <div class="hero-t"><p id="hello"></p><h2 id="semaineT"></h2></div>
 </div>
 <div class="card coach"><b>Le mot du coach</b><p id="coach"></p></div>
 <div class="row">
  <div class="card ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" class="rb"/><circle id="rf" cx="40" cy="40" r="32" class="rf"/></svg><span id="rn"></span><small>séances cette semaine</small></div>
  <div class="card water"><b id="wn">0</b><small>verres d'eau (objectif 8)</small><button id="wadd">+ 1 verre</button></div>
 </div>
 <div class="card"><b>Total</b><p id="total"></p></div>
</section>
<section id="seance" class="tab">
 <div class="seg" id="typeSeg"><button data-t="A" class="on">A · Jambes + abdos</button><button data-t="B">B · Corps entier</button></div>
 <label class="wk">Semaine <select id="week"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
 <div class="prog"><i id="pbar"></i></div>
 <div id="exos"></div>
 <button class="main" id="finish">Terminer la séance</button>
</section>
<section id="suivi" class="tab">
 <div class="card"><b>Nouvelle mesure</b>
  <div class="inp"><input id="iw" type="number" step="0.1" inputmode="decimal" placeholder="Poids (kg)"><input id="it" type="number" step="0.5" inputmode="decimal" placeholder="Tour de taille (cm)"></div>
  <button class="main" id="addm">Enregistrer</button></div>
 <div class="card"><b>Évolution du poids</b><canvas id="chart" height="170"></canvas><p id="delta" class="mut"></p></div>
 <div id="mlist"></div>
</section>
<section id="photos" class="tab">
 <label class="main fab">Ajouter une photo<input id="pf" type="file" accept="image/*" hidden></label>
 <p class="mut">Même lumière, même pose, une fois par semaine : c'est la meilleure preuve de progression.</p>
 <div id="grid" class="grid"></div>
</section>
</main>
<div id="rest" hidden><span>Repos</span><b id="rt">60</b><button id="rskip">Passer</button></div>
<div id="toast" hidden></div>
<nav class="nav">
 <button data-tab="accueil" class="on"><i>⌂</i>Accueil</button>
 <button data-tab="seance"><i>◉</i>Séance</button>
 <button data-tab="suivi"><i>↗</i>Suivi</button>
 <button data-tab="photos"><i>▣</i>Photos</button>
</nav>
<script src="app.js"></script>
</body></html>
